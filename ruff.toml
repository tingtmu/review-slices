# Bug-catching rules only: this repo's code is written by agents, so style rules add churn without catching bugs.
# Never ruff's unconfigured default (mostly style). The scripts in skills/review-slices/scripts/ that are vendored into
# repos carry a file-level `# ruff: noqa` header (so adopting repos' linters skip them), which hides them from
# `ruff check .` here too; tests/lint_guard.py (a REVIEW.md test: line) lints them under these rules with the header blanked.
[lint]
select = ["F", "E9", "B", "PLE", "BLE001", "S110", "S112", "ASYNC", "T100", "PGH003", "PGH004",
          "RUF006", "RUF008", "RUF009", "RUF012", "RUF016", "RUF018", "RUF024", "RUF100",
          "PLW0177", "PLW1508", "PLW1510"]
ignore = ["B008", "B028", "B905"]
