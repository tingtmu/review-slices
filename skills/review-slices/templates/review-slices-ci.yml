# Copy to .github/workflows/review-slices.yml. On every pull request it checks that each new commit is covered by
# a review trailer, on the server, where no clone can skip the hook. It runs the guard committed on the base branch.
# CI runs the suite in its own jobs, so this job needs no pass stamp. When REVIEW.md says `secrets: gitleaks`, the
# same check scans the new commits with the pinned, checksum-verified gitleaks below; otherwise that step is unused.
name: review-slices

on:
  pull_request:

permissions:
  contents: read

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install gitleaks (used only when REVIEW.md has a secrets line)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: Review trailers cover every new commit
        run: python3 .githooks/review_slices.py ci "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
